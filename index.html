
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tavia AI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #171717;
    color: white;
    height: 100vh;
    display: flex;
}

/* SIDEBAR */
.sidebar {
    width: 250px;
    background: #202020;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 30px;
    color: #c4a5ff;
}

.new-chat {
    background: #303030;
    color: white;
    border: 1px solid #555;
    padding: 13px;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
}

.new-chat:hover {
    background: #414141;
}

.history-title {
    margin-top: 30px;
    color: #aaa;
    font-size: 13px;
}

.history {
    margin-top: 15px;
    color: #ddd;
    font-size: 14px;
    overflow-y: auto;
}

.history div {
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
}

.history div:hover {
    background: #333;
}

.sidebar-bottom {
    margin-top: auto;
    color: #aaa;
    font-size: 12px;
}

/* MAIN */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    padding: 20px;
    border-bottom: 1px solid #333;
    font-size: 17px;
    font-weight: bold;
}

.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 25px 8%;
}

.welcome {
    text-align: center;
    margin: 100px auto 30px;
}

.welcome h1 {
    font-size: 34px;
    margin-bottom: 15px;
    background: linear-gradient(90deg,#c4a5ff,#8bbdff);
    -webkit-background-clip: text;
    color: transparent;
}

.welcome p {
    color: #aaa;
}

.message {
    margin-bottom: 25px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.message.user {
    align-items: flex-end;
}

.message.ai {
    align-items: flex-start;
}

.sender {
    font-size: 12px;
    color: #aaa;
}

.bubble {
    max-width: 80%;
    padding: 14px 18px;
    border-radius: 15px;
    line-height: 1.6;
    font-size: 15px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user .bubble {
    background: #6846a8;
    border-bottom-right-radius: 4px;
}

.ai .bubble {
    background: #292929;
    border-bottom-left-radius: 4px;
}

/* INPUT */
.input-area {
    padding: 15px 8% 25px;
}

.input-box {
    display: flex;
    background: #292929;
    border: 1px solid #555;
    border-radius: 15px;
    padding: 8px;
    gap: 10px;
}

.input-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    padding: 12px;
    font-size: 15px;
    min-width: 0;
}

.input-box button {
    background: #9a72e8;
    border: none;
    color: white;
    padding: 0 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
}

.input-box button:hover {
    background: #8056d0;
}

.note {
    color: #777;
    text-align: center;
    font-size: 11px;
    margin-top: 12px;
}

@media(max-width:650px) {
    .sidebar {
        display: none;
    }

    .chat-area {
        padding: 20px 15px;
    }

    .input-area {
        padding: 12px;
    }

    .welcome {
        margin-top: 120px;
    }

    .welcome h1 {
        font-size: 29px;
    }

    .bubble {
        max-width: 95%;
    }
}
</style>
</head>

<body>

<aside class="sidebar">
    <div class="logo">✦ Tavia AI</div>

    <button class="new-chat" onclick="newChat()">
        ＋ Chat Baru
    </button>

    <div class="history-title">RIWAYAT CHAT</div>
    <div class="history" id="history"></div>

    <div class="sidebar-bottom">
        ✦ Tavia AI Version 1.0
    </div>
</aside>

<main class="main">

    <div class="topbar">
        ✦ Tavia AI
    </div>

    <div class="chat-area" id="chatArea">

        <div class="welcome" id="welcome">
            <h1>Halo, selamat datang!</h1>
            <p>Ada yang bisa Tavia bantu hari ini?</p>
        </div>

    </div>

    <div class="input-area">
        <div class="input-box">
            <input
                type="text"
                id="userInput"
                placeholder="Tanyakan sesuatu kepada Tavia..."
                onkeydown="if(event.key==='Enter') sendMessage()"
            >

            <button onclick="sendMessage()">➤</button>
        </div>

        <div class="note">
            Tavia AI dapat memberikan jawaban yang kurang tepat.
        </div>
    </div>

</main>

<script>
let conversations = [];
let currentChat = [];

function newChat() {
    currentChat = [];
    document.getElementById("chatArea").innerHTML = `
        <div class="welcome" id="welcome">
            <h1>Halo, selamat datang!</h1>
            <p>Ada yang bisa Tavia bantu hari ini?</p>
        </div>
    `;
    document.getElementById("userInput").focus();
}

function addMessage(text, sender) {
    const area = document.getElementById("chatArea");

    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();

    const message = document.createElement("div");
    message.className = "message " + sender;

    const name = document.createElement("div");
    name.className = "sender";
    name.textContent = sender === "user" ? "Kamu" : "✦ Tavia AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    message.appendChild(name);
    message.appendChild(bubble);
    area.appendChild(message);

    area.scrollTop = area.scrollHeight;
}

function getReply(message) {
    let text = message.toLowerCase();

    if (text.includes("halo") || text.includes("hai")) {
        return "Halo juga! 👋 Aku Tavia AI. Senang bisa membantu kamu. Ada yang ingin ditanyakan?";
    }

    if (text.includes("nama kamu")) {
        return "Namaku Tavia AI! Aku adalah asisten virtual yang siap membantu menjawab pertanyaanmu.";
    }

    if (text.includes("siapa kamu")) {
        return "Aku adalah Tavia AI, asisten virtual yang dibuat untuk membantu kamu belajar dan mencari informasi.";
    }

    if (text.includes("python")) {
        return "Python adalah bahasa pemrograman yang mudah dipelajari. Python bisa digunakan untuk membuat aplikasi, website, dan mengolah data.";
    }

    if (text.includes("html")) {
        return "HTML adalah bahasa markup yang digunakan untuk membuat struktur halaman website. Contohnya menggunakan tag <h1>, <p>, dan <body>.";
    }

    if (text.includes("css")) {
        return "CSS digunakan untuk mengatur tampilan website, seperti warna, ukuran tulisan, background, dan tata letak.";
    }

    if (text.includes("terima kasih")) {
        return "Sama-sama! Senang bisa membantu kamu. 💜";
    }

    if (text.includes("belajar")) {
        return "Semangat belajarnya! Kamu bisa mulai dengan mempelajari materi sedikit demi sedikit. Jangan takut mencoba dan bertanya.";
    }

    if (text.includes("kabar")) {
        return "Aku siap membantu kamu hari ini! Bagaimana, ada yang ingin kamu tanyakan?";
    }

    return "Terima kasih sudah bertanya! Aku Tavia AI versi demo. Saat ini aku masih memiliki kemampuan menjawab yang terbatas. Untuk mendapatkan jawaban lebih luas dan cerdas, website ini perlu dihubungkan dengan API AI.";
}

function sendMessage() {
    const input = document.getElementById("userInput");
    const message = input.value.trim();

    if (message === "") return;

    addMessage(message, "user");
    currentChat.push(message);
    input.value = "";

    setTimeout(() => {
        const reply = getReply(message);
        addMessage(reply, "ai");
        currentChat.push(reply);
        saveHistory(message);
    }, 500);
}

function saveHistory(message) {
    if (currentChat.length === 2) {
        conversations.unshift(message);
        renderHistory();
    }
}

function renderHistory() {
    const history = document.getElementById("history");
    history.innerHTML = "";

    conversations.forEach(item => {
        const div = document.createElement("div");
        div.textContent = "💬 " + item;
        div.onclick = () => {
            newChat();
            document.getElementById("userInput").value = item;
        };
        history.appendChild(div);
    });
}
</script>

</body>
</html>
